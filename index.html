<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダメージ計算ツール</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 20px auto;
        }

        h1 {
            font-size: 1.4rem;
        }

        fieldset {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin: 4px 0;
        }

        input[type="number"] {
            width: 120px;
        }

        .result {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
            white-space: pre-wrap;
        }

        .coin-buff-group {
            border: 1px dashed #ccc;
            padding: 8px;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .bulk-buff-box {
            background-color: #f9f9f9;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>ダメージ計算ツール</h1>
    <!-- 最終威力計算 -->
    <fieldset>
        <legend>最終威力計算</legend>

        <label>
            基本威力:
            <input id="basePower" type="number" value="20" step="1">
        </label>

        <label>
            基本威力増加、減少:
            <input id="basePowerUp" type="number" value="0" step="1">
        </label>

        <label>
            コイン数:
            <input id="coinCount" type="number" value="3" step="1">
        </label>

        <label>
            コイン威力:
            <input id="coinPower" type="number" value="5" step="1">
        </label>

        <label>
            コイン威力増加、減少:
            <input id="coinPowerUp" type="number" value="0" step="1">
        </label>

        <label>
            最終威力増加、減少:
            <input id="finalPowerUp" type="number" value="0" step="1">
        </label>
    </fieldset>

    <!-- 精神力 -->
    <fieldset>
        <legend>精神力</legend>
        <label>
            精神力（-45 ～ 45）:
            <input id="sp" type="number" value="45" min="-45" max="45" step="1">
        </label>
    </fieldset>

    <!-- コイン勝敗モード -->
    <fieldset>
        <legend>コイン勝敗モード</legend>

        <label>
            <input type="radio" name="coinMode" value="random" checked>
            ランダム（精神力）
        </label>

        <label>
            <input type="radio" name="coinMode" value="fixed">
            固定シミュレーション（手動入力）
        </label>

        <div id="fixedCoinInputs"></div>
    </fieldset>

    <!-- 体力・混乱区間 -->
    <fieldset>
        <legend>体力・混乱区間</legend>
        <label>
            最大体力:
            <input id="maxHp" type="number" value="200" min="1" step="1">
        </label>
        <label>
            混乱区間1 (HP):
            <input id="threshold1" type="number" value="150" min="0" step="1">
        </label>
        <label>
            混乱区間2 (HP):
            <input id="threshold2" type="number" value="100" min="0" step="1">
        </label>
        <label>
            混乱区間3 (HP):
            <input id="threshold3" type="number" value="50" min="0" step="1">
        </label>
        <label>
            <input id="immortalMode" type="checkbox">
            敵を死なないようにする（HPが0以下でも継続）
        </label>
    </fieldset>

    <!-- 麻痺 -->
    <fieldset>
        <legend>麻痺</legend>
        <label>
            麻痺:
            <input id="paralysis" type="number" value="0" min="0" step="1">
        </label>
    </fieldset>

    <!-- 破裂 -->
    <fieldset>
        <legend>破裂</legend>
        <label>
            破裂威力:
            <input id="rupturePotency" type="number" value="0" min="0" step="1">
        </label>
        <label>
            破裂回数:
            <input id="ruptureCount" type="number" value="0" min="0" step="1">
        </label>
    </fieldset>

    <!-- 呼吸 -->
    <fieldset>
        <legend>呼吸</legend>
        <label>
            呼吸威力:
            <input id="poisePotency" type="number" value="0" min="0" step="1">
        </label>
        <label>
            呼吸回数:
            <input id="poiseCount" type="number" value="0" min="0" step="1">
        </label>
    </fieldset>

    <!-- 特殊加算 -->
    <fieldset>
        <legend>特殊加算（《なんでも料理できるさ》）</legend>
        <label>
            特殊加算値:
            <input id="special" type="number" value="0" step="1">
        </label>
    </fieldset>

    <!-- ステータス補正 -->
    <fieldset>
        <legend>ステータス補正（保護・脆弱・増加・減少）</legend>

        <label>
            保護、脆弱 (-10〜10)(+は保護、-は脆弱):
            <input id="protect" type="number" value="0" min="-10" max="10">
        </label>

        <label>
            ダメージ量(-10〜10):
            <input id="dmgUp" type="number" value="0" min="-10" max="10">
        </label>
    </fieldset>

    <!-- コイン別バフ枠・固定ダメージ -->
    <fieldset>
        <legend>コイン別バフ枠・固定ダメージ</legend>
        <div class="bulk-buff-box">
            <strong>一括変更</strong>
            <label>パッシブ一括: <input id="bulkPassive" type="number" value="0" step="1"></label>
            <label>ギフト一括: <input id="bulkGift" type="number" value="0" step="1"></label>
            <label>スキル効果一括: <input id="bulkSkill" type="number" value="0" step="1"></label>
            <label>その他(+α)一括: <input id="bulkExtra" type="number" value="0" step="1"></label>
            <label>クリティカル威力増加一括: <input id="bulkCrit" type="number" value="0" step="1"></label>
            <label>固定ダメージ一括: <input id="bulkFixedDmg" type="number" value="0" step="1"></label>
            <button type="button" onclick="applyBulkBuffs()">すべてのコインに一括適用</button>
        </div>
        <div id="coinBuffInputs"></div>
    </fieldset>

    <!-- 耐性枠 -->
    <fieldset>
        <legend>耐性枠</legend>

        <h3>耐性補正</h3>
        <label>
            攻撃タイプ耐性倍率:
            <input id="typeResist" type="number" value="1.0" step="0.25">
        </label>
        <label>
            罪悪属性耐性倍率:
            <input id="sinResist" type="number" value="1.0" step="0.25">
        </label>

        <h3>レベル差補正</h3>
        <label>
            攻撃レベル:
            <input id="atkLevel" type="number" value="30" step="1">
        </label>
        <label>
            防御レベル:
            <input id="defLevel" type="number" value="30" step="1">
        </label>

        <h3>マッチ回数・観察レベル</h3>
        <label>
            マッチ回数:
            <input id="matchCount" type="number" value="0" step="1">
        </label>
        <label>
            観察レベル:
            <input id="observeLevel" type="number" value="0" step="1">
        </label>
        <label>
            <input id="observeEnabled" type="checkbox" checked>
            観察レベル補正を有効にする
        </label>

        <h3>クリティカル</h3>
        <label>
            <input id="isCritical" type="checkbox">
            クリティカル発生（常時）
        </label>
        <label>
            クリティカル補正値（通常 0.2）:
            <input id="criticalBonus" type="number" value="0.2" step="0.01">
        </label>
    </fieldset>

    <button onclick="calc()">計算する</button>

    <div class="result" id="result"></div>

    <script>
        /* --- 勝率計算（精神力） --- */
        function getCoinWinRate(sp) {
            return Math.max(5, Math.min(95, sp + 50)) / 100;
        }

        function tossCoin(sp) {
            const winRate = getCoinWinRate(sp);
            return Math.random() < winRate;
        }

        /* --- 耐性補正 --- */
        function resistToCorrection(mult) {
            return mult >= 1.0 ? (mult - 1.0) : (mult - 1.0) / 2.0;
        }

        /* --- 固定モード・コイン別バフの入力欄生成 --- */
        function updateCoinInputs() {
            const coinCount = Number(document.getElementById('coinCount').value);
            const container = document.getElementById('fixedCoinInputs');
            const buffContainer = document.getElementById('coinBuffInputs');

            container.innerHTML = "";
            buffContainer.innerHTML = "";

            const mode = document.querySelector('input[name="coinMode"]:checked').value;

            for (let i = 1; i <= coinCount; i++) {
                if (mode === "fixed") {
                    const row = document.createElement("div");
                    row.innerHTML = `
                      コイン${i}：
                      <select id="coinResult${i}">
                        <option value="win">表</option>
                        <option value="lose">裏</option>
                      </select>
                      クリティカル：
                      <select id="coinCritical${i}">
                        <option value="no">なし</option>
                        <option value="yes">あり</option>
                      </select>
                    `;
                    container.appendChild(row);
                }

                const buffRow = document.createElement("div");
                buffRow.className = "coin-buff-group";
                buffRow.innerHTML = `
                    <strong>コイン${i} バフ枠・追加効果</strong>
                    <label>パッシブ: <input id="passiveBuff${i}" type="number" value="0" step="1"></label>
                    <label>ギフト: <input id="giftBuff${i}" type="number" value="0" step="1"></label>
                    <label>スキル効果: <input id="skillBuff${i}" type="number" value="0" step="1"></label>
                    <label>その他(+α): <input id="extraBuff${i}" type="number" value="0" step="1"></label>
                    <label>クリティカル威力増加: <input id="critDmgBuff${i}" type="number" value="0" step="1"></label>
                    <label>固定ダメージ: <input id="fixedDmg${i}" type="number" value="0" step="1"></label>
                `;
                buffContainer.appendChild(buffRow);
            }
        }

        /* --- 一括適用関数 --- */
        function applyBulkBuffs() {
            const coinCount = Number(document.getElementById('coinCount').value);
            const bulkP = document.getElementById('bulkPassive').value;
            const bulkG = document.getElementById('bulkGift').value;
            const bulkS = document.getElementById('bulkSkill').value;
            const bulkE = document.getElementById('bulkExtra').value;
            const bulkC = document.getElementById('bulkCrit').value;
            const bulkF = document.getElementById('bulkFixedDmg').value;

            for (let i = 1; i <= coinCount; i++) {
                document.getElementById(`passiveBuff${i}`).value = bulkP;
                document.getElementById(`giftBuff${i}`).value = bulkG;
                document.getElementById(`skillBuff${i}`).value = bulkS;
                document.getElementById(`extraBuff${i}`).value = bulkE;
                document.getElementById(`critDmgBuff${i}`).value = bulkC;
                document.getElementById(`fixedDmg${i}`).value = bulkF;
            }
        }

        document.getElementById('coinCount').addEventListener('change', updateCoinInputs);
        document.querySelectorAll('input[name="coinMode"]').forEach(el => {
            el.addEventListener('change', updateCoinInputs);
        });

        // 初期化時にも実行
        updateCoinInputs();

        /* --- コイン式ダメージ計算 --- */
        function calcCoinDamageSequence(finalPowerBase, special, resistFrame,
            coinPower, coinPowerUp, coinCount, sp, mode, criticalBonus,
            paralysis, rupturePotency, ruptureCount, poisePotency, poiseCount,
            maxHp, t1, t2, t3, immortalMode, statusCorrection) {

            let currentPower = finalPowerBase;
            let coinBonus = coinPower + coinPowerUp;
            let totalDamage = 0;
            let log = [];

            let curRuptureCount = ruptureCount;
            let curPoiseCount = poiseCount;
            let remainingParalysis = paralysis;

            let currentHp = maxHp;
            let hpList = [t1, t2, t3].filter(t => t > 0).sort((a, b) => b - a);
            let triggeredThresholds = new Set();
            let isDefeated = false;

            for (let i = 1; i <= coinCount; i++) {
                if (isDefeated) break;

                let win;
                let crit;

                if (mode === "fixed") {
                    win = (document.getElementById(`coinResult${i}`).value === "win");
                    crit = (document.getElementById(`coinCritical${i}`).value === "yes");
                } else {
                    win = tossCoin(sp);
                    if (poisePotency > 0 && curPoiseCount > 0) {
                        const poiseCritRate = Math.min(1.0, poisePotency * 0.05);
                        crit = Math.random() < poiseCritRate;
                    } else {
                        crit = document.getElementById('isCritical').checked;
                    }
                }

                if (win) {
                    if (remainingParalysis > 0) {
                        remainingParalysis--;
                    } else {
                        currentPower += coinBonus;
                    }
                }

                const pBuff = Number(document.getElementById(`passiveBuff${i}`).value);
                const gBuff = Number(document.getElementById(`giftBuff${i}`).value);
                const sBuff = Number(document.getElementById(`skillBuff${i}`).value);
                const eBuff = Number(document.getElementById(`extraBuff${i}`).value);
                const cBuff = Number(document.getElementById(`critDmgBuff${i}`).value);
                const addFixedDmg = Number(document.getElementById(`fixedDmg${i}`).value);

                const buffFrame = 1 + statusCorrection + (pBuff + gBuff + sBuff + eBuff) / 100;
                const totalCriticalBonus = criticalBonus + (cBuff * 0.1);

                let resistFrameFinal = resistFrame + (crit ? totalCriticalBonus : 0);

                const currentSpecial = (i === coinCount) ? special : 0;
                const base = currentPower * buffFrame + currentSpecial;
                let dmg = Math.max(1, Math.floor(base * resistFrameFinal));

                if (addFixedDmg > 0) {
                    dmg += addFixedDmg;
                }

                let ruptureDmg = 0;
                if (curRuptureCount > 0 && rupturePotency > 0) {
                    ruptureDmg = rupturePotency;
                    dmg += ruptureDmg;
                    curRuptureCount = Math.max(0, curRuptureCount - 1);
                }

                if (crit && curPoiseCount > 0) {
                    curPoiseCount = Math.max(0, curPoiseCount - 1);
                }

                totalDamage += dmg;
                let prevHp = currentHp;
                
                if (immortalMode) {
                    currentHp -= dmg;
                } else {
                    currentHp = Math.max(0, currentHp - dmg);
                }

                let statusMsg = [];

                hpList.forEach(t => {
                    if (!triggeredThresholds.has(t) && prevHp > t && currentHp <= t) {
                        triggeredThresholds.add(t);
                        statusMsg.push(`【混乱】(HP${t})`);
                    }
                });

                if (!immortalMode && currentHp === 0 && prevHp > 0) {
                    statusMsg.push(`【撃破】`);
                    isDefeated = true;
                }

                log.push({
                    coin: i,
                    win: win,
                    crit: crit,
                    power: currentPower,
                    damage: dmg,
                    ruptureDamage: ruptureDmg,
                    fixedDamage: addFixedDmg,
                    remainingHp: currentHp,
                    statusMsg: statusMsg.join(" ")
                });
            }

            return { totalDamage, log };
        }

        /* --- メイン計算 --- */
        function calc() {
            const basePower = Number(document.getElementById('basePower').value);
            const basePowerUp = Number(document.getElementById('basePowerUp').value);
            const coinCount = Number(document.getElementById('coinCount').value);
            const coinPower = Number(document.getElementById('coinPower').value);
            const coinPowerUp = Number(document.getElementById('coinPowerUp').value);
            const finalPowerUp = Number(document.getElementById('finalPowerUp').value);

            const finalPowerBase = basePower + basePowerUp + finalPowerUp;
            const special = Number(document.getElementById('special').value);

            const protect = Number(document.getElementById('protect').value);
            const dmgUp = Number(document.getElementById('dmgUp').value);
            const statusCorrection = (0.1 * dmgUp) - (0.1 * protect);

            const typeCorrection = resistToCorrection(Number(document.getElementById('typeResist').value));
            const sinCorrection = resistToCorrection(Number(document.getElementById('sinResist').value));
            const resistCorrection = typeCorrection + sinCorrection;

            const atkLevel = Number(document.getElementById('atkLevel').value);
            const defLevel = Number(document.getElementById('defLevel').value);
            const levelDiff = atkLevel - defLevel;
            const levelCorrection = levelDiff === 0 ? 0 : levelDiff / (25 + Math.abs(levelDiff));

            const matchCorrection = 0.03 * Number(document.getElementById('matchCount').value);
            const observeEnabled = document.getElementById('observeEnabled').checked;
            const observeCorrection = observeEnabled ? 0.03 * Number(document.getElementById('observeLevel').value) : 0;

            const isCritical = document.getElementById('isCritical').checked;
            const criticalBonus = Number(document.getElementById('criticalBonus').value);

            const resistFrame =
                1 +
                resistCorrection +
                levelCorrection +
                matchCorrection +
                observeCorrection;

            const mode = document.querySelector('input[name="coinMode"]:checked').value;
            const sp = Number(document.getElementById('sp').value);
            const paralysis = Number(document.getElementById('paralysis').value);
            const rupturePotency = Number(document.getElementById('rupturePotency').value);
            const ruptureCount = Number(document.getElementById('ruptureCount').value);
            const poisePotency = Number(document.getElementById('poisePotency').value);
            const poiseCount = Number(document.getElementById('poiseCount').value);

            const maxHp = Number(document.getElementById('maxHp').value);
            const t1 = Number(document.getElementById('threshold1').value);
            const t2 = Number(document.getElementById('threshold2').value);
            const t3 = Number(document.getElementById('threshold3').value);
            const immortalMode = document.getElementById('immortalMode').checked;

            const result = calcCoinDamageSequence(
                finalPowerBase,
                special,
                resistFrame,
                coinPower,
                coinPowerUp,
                coinCount,
                sp,
                mode,
                criticalBonus,
                paralysis,
                rupturePotency,
                ruptureCount,
                poisePotency,
                poiseCount,
                maxHp,
                t1,
                t2,
                t3,
                immortalMode,
                statusCorrection
            );

            let text = `総ダメージ: ${result.totalDamage}\n\n--- コイン詳細 ---\n`;

            result.log.forEach(entry => {
                text += `コイン${entry.coin}: ${entry.win ? "表" : "裏"} / クリティカル=${entry.crit ? "あり" : "なし"} / 威力=${entry.power} / ダメージ=${entry.damage}`;
                if (entry.fixedDamage > 0) {
                    text += ` (内 固定ダメージ=${entry.fixedDamage})`;
                }
                if (entry.ruptureDamage > 0) {
                    text += ` (内 破裂=${entry.ruptureDamage})`;
                }
                text += ` / 残りHP=${entry.remainingHp}`;
                if (entry.statusMsg) {
                    text += ` ${entry.statusMsg}`;
                }
                text += `\n`;
            });

            document.getElementById('result').textContent = text;
        }
    </script>
</body>
</html>
